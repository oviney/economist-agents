# Pre-commit hooks for economist-agents
# Install: pre-commit install --install-hooks
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Format code (auto-fixes)
      - id: ruff-format
        name: ruff format
        description: Format Python code with ruff

      # Lint code (check only, no auto-fix)
      - id: ruff
        name: ruff check
        description: Lint Python code with ruff (check only)
        args: []

  # Mypy - Static type checking
  #
  # B-031: this was `stages: [manual]`, so it never ran — an inert sensor next to a
  # CLAUDE.md that says "Type hints mandatory". It is now a real pre-commit hook.
  #
  # `--follow-imports=silent` is what makes that survivable. pre-commit passes the staged
  # files, but mypy follows their imports, so without the flag a commit touching one clean
  # file inherits errors from the 611-error repo-wide backlog — and the gate would be back
  # on `manual` within a day. Scoped this way it reports only errors in the files being
  # committed: new type errors are blocked, old ones get paid down deliberately rather
  # than all at once. Repo-wide mypy stays advisory in `make ci-local` for that reason.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy type check
        description: Static type checking with mypy on staged files
        files: ^scripts/
        args: [--config-file=mypy.ini, --follow-imports=silent, --no-error-summary]
        additional_dependencies:
          - types-PyYAML
          - types-requests
        verbose: true

  # Pytest - Run test suite on push (not commit for speed)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        description: Run test suite with pytest (pre-push only)
        entry: .venv/bin/pytest
        args: [tests/, -v, --tb=short]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]  # Only run on git push, not git commit

      # Badge validation - Prevent stale badges (BUG-023)
      #
      # B-031: the entry was `bash -c '... || true'`, which cannot fail — an
      # always-green gate on the very defect it exists to prevent. The `|| true` is
      # gone; a stale badge now fails the commit.
      - id: badge-validation
        name: validate README badges
        description: Ensure badges match live data (prevents BUG-023)
        entry: python3 scripts/validate_badges.py
        language: system
        pass_filenames: false
        files: ^(README\.md|quality_score\.json|data/skills_state/sprint_tracker\.json|.*_badge\.json)$
        always_run: false

      # ADR governance lint (skills/adr-governance/SKILL.md)
      - id: adr-lint
        name: lint ADRs
        description: Enforce ADR numbering, status, supersession, and location rules
        entry: .venv/bin/python scripts/lint_adrs.py
        language: system
        pass_filenames: false
        files: ^(docs/adr/|mkdocs\.yml$|docs/ADR-.*\.md$|docs/architecture/ADR.*\.md$)
        always_run: false

      # Skill anatomy validation (issues #293 #294 — docs/skill-anatomy.md)
      - id: validate-skills
        name: validate SKILL.md anatomy
        description: Enforce skills/*/SKILL.md frontmatter and required sections
        entry: .venv/bin/python scripts/validate_skills.py
        language: system
        pass_filenames: false
        files: ^skills/.+/SKILL\.md$
        always_run: false

      # Agent YAML validation (ADR-0001)
      - id: validate-agent-yaml
        name: validate agent YAML configs
        description: Validate agent YAML files against agents/schema.json
        entry: .venv/bin/python scripts/agent_loader.py --validate
        language: system
        pass_filenames: false
        files: ^agents/.*\.yaml$

      # B-031: a second `validate-skills` registration lived here — same hook id as
      # the one above, and with `always_run: false` duplicated as a YAML key so the
      # later mapping silently won. Removed; the registration above is the only one.

      # Architecture review - catches anti-patterns before CI (issue: pre-commit-arch-review)
      - id: arch-review
        name: architecture review
        description: >
          Check staged Python files for architectural anti-patterns:
          ADR-002 (direct LLM imports), unprotected json.loads, hardcoded
          secrets, and print() used for error reporting.
          Fails commit if error-level violations are found.
        entry: .venv/bin/python scripts/pre_commit_arch_check.py
        language: system
        types: [python]
        pass_filenames: true

  # Basic file checks (check-only, no auto-fix)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: check yaml
        description: Validate YAML files
        args: [--unsafe]  # Allow custom tags like mkdocs !!python/name:

      - id: check-json
        name: check json
        description: Validate JSON files
        exclude: ^tests/fixtures/

      - id: check-added-large-files
        name: check for large files
        description: Prevent large files from being committed
        args: [--maxkb=1000]

      - id: check-merge-conflict
        name: check for merge conflicts
        description: Check for merge conflict markers

  # B-031: a `pytest-coverage` hook lived here on `stages: [manual]`, so it never
  # ran, and it declared a 40% threshold while `make ci-local` declared 70% — two
  # numbers for one gate, neither enforced here. Removed. Coverage has exactly one
  # authority: `make ci-local` (70% overall, 90% src/quality), which `make test`
  # now matches. The `pytest` pre-push hook above still runs the suite.
